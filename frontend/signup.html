<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>회원가입 | StockPilot</title>

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <a href="./index.html" class="logo"> StockPilot </a>
      </div>
    </header>

    <main class="auth-page">
      <section class="auth-card">
        <div class="auth-top">
          <span class="auth-label"> STOCKPILOT </span>

          <h1>StockPilot 시작하기</h1>

          <p>간단한 정보만 입력하면 바로 시작할 수 있어요.</p>
        </div>

        <form id="signupForm">
          <div class="auth-field">
            <label for="nickname"> 닉네임 </label>

            <input id="nickname" type="text" placeholder="닉네임" required />
          </div>

          <div class="auth-field">
            <label for="email"> 이메일 </label>

            <input
              id="email"
              type="email"
              placeholder="example@email.com"
              required
            />
          </div>

          <div class="auth-field">
            <label for="password"> 비밀번호 </label>

            <div class="password-input-wrap">
              <input id="password" type="password" placeholder="8자 이상 입력하세요" minlength="8" required />
              <button id="togglePasswordButton" type="button" aria-label="비밀번호 보기" aria-pressed="false">보기</button>
            </div>
          </div>

          <p id="signupMessage" class="auth-message"></p>

          <button id="signupButton" class="auth-submit" type="submit">
            회원가입
          </button>
        </form>

        <div class="auth-bottom">
          <span> 이미 계정이 있나요? </span>

          <a href="./login.html"> 로그인 </a>
        </div>
      </section>
    </main>

    <script src="./js/config.js"></script>
    <script src="./js/signup.js"></script>
  </body>
</html>
